{% extends "base.html" %}
{% block title %}Student Login{% endblock %}
{% block content %}
<div class="card" style="max-width:430px;margin:70px auto">
    <h1>Check Your Result</h1>
    <p class="muted">Enter your name and roll number.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Name</label>
        <input name="name" required>
        <label>Roll Number</label>
        <input name="roll" required>
        <button type="submit">View Result</button>
    </form>
</div>
{% endblock %}
