<!DOCTYPE html>
<html>
<head>
    <title>CORE Result Entry</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #2a5298;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #2a5298;
            outline: none;
            box-shadow: 0 0 5px rgba(42,82,152,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1e3c72;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #2a5298;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Submit CORE Result</h2>

    <form method="POST" action="{% url 'submit_core' %}">
        {% csrf_token %}

        <input type="text" name="student_id" placeholder="Student ID" required>
        <input type="text" name="subject_id" placeholder="Subject ID" required>
        <input type="number" name="marks" placeholder="Marks Obtained" required>
        <input type="number" name="total_marks" placeholder="Total Marks" required>

        <button type="submit">Save CORE Result</button>
    </form>

    <div>
        <a href="{% url 'dashboard' %}" class="back-link">⬅ Back to Dashboard</a>
    </div>

    <div class="footer">
        SRMS College Portal © 2026
    </div>
</div>

</body>
</html>
