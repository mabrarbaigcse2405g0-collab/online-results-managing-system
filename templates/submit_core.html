<!DOCTYPE html>
<html>
<head>
    <title>CORE Result Entry</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #2a5298;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2a5298;
            outline: none;
            box-shadow: 0 0 5px rgba(42,82,152,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1e3c72;
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="card">
     <h2>Submit CORE Result</h2>

<h2>Submit CORE Result</h2>

<form method="POST" action="/submit-core/">
    {% csrf_token %}

    <input type="text" name="student_id" placeholder="Student ID"><br><br>

    <input type="text" name="subject_id" placeholder="Subject ID"><br><br>

    <input type="number" name="marks" placeholder="Marks"><br><br>

    <input type="number" name="total_marks" placeholder="Total Marks"><br><br>

    <button type="submit">Save CORE Result</button>
</form>


    <div class="footer">
        SRMS College Portal © 2026
    </div>
</div>

</body>
</html>
