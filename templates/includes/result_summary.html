<style>
    .result-summary {
        background: #ffffff;
        color: #2b2b2b;
        max-width: 420px;
        margin: 20px auto;
        padding: 18px 26px;
        border-radius: 12px;
        border-left: 6px solid #2e7d32;
        box-shadow: 0 8px 18px rgba(0,0,0,0.15);
        text-align: left;
    }

    .result-summary h3 {
        margin: 0 0 12px 0;
        font-size: 20px;
        color: #1b5e20;
    }

    .result-summary ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .result-summary li {
        padding: 6px 0;
        font-size: 16px;
        border-bottom: 1px solid #eee;
    }

    .result-summary li:last-child {
        border-bottom: none;
    }

    .result-summary .status-pass { color: #2e7d32; font-weight: bold; }
    .result-summary .status-fail { color: #c62828; font-weight: bold; }
    .result-summary .status-na   { color: #777;    font-weight: bold; }
</style>

<div class="result-summary">
    <h3>Result Summary</h3>
    <ul>
        <li><strong>Total Marks:</strong> {{ summary.total_marks }}</li>
        <li><strong>Subjects:</strong> {{ summary.subjects }}</li>
        <li><strong>Average:</strong> {{ summary.average|floatformat:2 }}</li>
        <li><strong>Status:</strong>
            <span class="{% if summary.status == 'PASS' %}status-pass{% elif summary.status == 'FAIL' %}status-fail{% else %}status-na{% endif %}">{{ summary.status }}</span>
        </li>
    </ul>
</div>
