<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .header-bar {
            display: flex;
            justify-content: flex-end;
            padding: 20px 40px;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            color: white;
        }

        .container {
            margin-top: 60px;
        }

        .card {
            display: inline-block;
            background: white;
            color: black;
            padding: 30px;
            margin: 20px;
            border-radius: 10px;
            width: 220px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .card:hover {
            transform: scale(1.05);
            background: #f1f1f1;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .student-sub {
            font-size: 18px;
            opacity: 0.9;
            margin-top: -10px;
            margin-bottom: 30px;
        }

        .welcome-card {
            background: white;
            color: #2b2b2b;
            max-width: 520px;
            margin: 0 auto 30px auto;
            padding: 24px 28px;
            border-radius: 12px;
            border-left: 6px solid #667eea;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: left;
        }

        .welcome-card h3 {
            margin: 0 0 14px 0;
            font-size: 20px;
            color: #4a4fa3;
        }

        .welcome-card .welcome-detail {
            margin: 4px 0;
            font-size: 16px;
        }

        .welcome-card .welcome-note {
            margin: 14px 0 0 0;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="header-bar">
    <a href="{% url 'logout' %}" class="logout-btn">🚪 Logout</a>
</div>

<div class="container">
    <h1>Welcome {{ student.name }}</h1>
    <div class="student-sub">Roll Number: {{ student.roll }}</div>

    <div class="welcome-card">
        <h3>Welcome to MGIT Student Result Management System</h3>
        <p class="welcome-detail"><strong>Name:</strong> {{ student.name }}</p>
        <p class="welcome-detail"><strong>Roll Number:</strong> {{ student.roll }}</p>
        <p class="welcome-note">View your academic results and subject-wise marks here.</p>
    </div>

    <a href="{% url 'omr_dashboard' %}">
        <div class="card">
            <h2>📝 OMR</h2>
            <p>View OMR Results</p>
        </div>
    </a>

    <a href="{% url 'core_result' student.id %}">
        <div class="card">
            <h2>📘 CORE</h2>
            <p>View Core Results</p>
        </div>
    </a>
</div>

</body>
</html>
