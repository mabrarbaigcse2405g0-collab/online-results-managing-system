{% extends "base.html" %}
{% block title %}Upload OMR{% endblock %}
{% block content %}
<div class="card" style="max-width:650px;margin:auto">
    <h1>Upload OMR Sheet</h1>
    <p class="muted">Upload a clear JPG/PNG scan (or PDF if Poppler is installed). The sheet should have 4 options per question: A, B, C, D.</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Subject</label>
        <select name="subject" required>
            <option value="">Select subject</option>
            {% for subject in subjects %}<option value="{{ subject.id }}">{{ subject.name }}</option>{% endfor %}
        </select>
        <label>OMR file</label>
        <input type="file" name="omr_image" accept=".jpg,.jpeg,.png,.pdf" required>
        <button type="submit">Process OMR</button>
    </form>
</div>
{% endblock %}
