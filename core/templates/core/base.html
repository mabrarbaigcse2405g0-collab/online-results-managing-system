<!DOCTYPE html>
<html>
<head>
    <title>SRMS - MGIT</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
        }

        .navbar {
            background: #002147;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar img {
            height: 45px;
            border-radius: 5px;
        }

        .nav-links a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #00c3ff;
        }

        .container {
            padding: 40px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
            animation: fadeIn 0.6s ease-in-out;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(to right, #007bff, #00c6ff);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .result-box {
            background: #e6f2ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="navbar">
    <img src="https://mgit.ac.in/wp-content/uploads/slider/cache/ee842e6a7c09dcb5c5c64e318d250d0f/mgit_buiding1.png">

    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
