{% extends 'core/base.html' %}

{% block content %}

<div class="card">
    <h2>Core Results</h2>

    {% for r in results %}
        <div class="result-box">
            <p><b>Score:</b> {{ r.score }}</p>
        </div>
    {% empty %}
        <p>No Core Results Available</p>
    {% endfor %}
</div>

{% endblock %}
